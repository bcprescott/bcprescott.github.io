<svg viewBox="0 0 840 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');

      .label { font-family: 'Caveat', cursive; fill: #3b3b3b; }
      .label-endpoint { font-size: 20px; font-weight: 600; }
      .label-sweet { font-size: 26px; font-weight: 700; fill: #1a6847; }
      .label-sub { font-size: 16px; fill: #777; font-family: 'Caveat', cursive; }
      .label-zone { font-size: 14px; font-family: 'Caveat', cursive; fill: #999; }
      .label-arrow { font-size: 15px; font-family: 'Caveat', cursive; fill: #1a6847; font-weight: 600; }
      .annotation { font-size: 15px; font-family: 'Caveat', cursive; fill: #666; font-style: italic; }
    </style>

    <!-- hand-drawn roughness filter -->
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="rough-light" x="-1%" y="-1%" width="102%" height="102%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- subtle paper texture -->
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>

    <!-- sweet spot glow -->
    <radialGradient id="sweetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background with paper texture -->
  <rect width="840" height="340" fill="#faf9f6" rx="6" filter="url(#paper)"/>

  <!-- zone backgrounds (very subtle) -->
  <rect x="80" y="120" width="200" height="60" rx="4" fill="#fde8e8" opacity="0.35" filter="url(#rough-light)"/>
  <rect x="560" y="120" width="200" height="60" rx="4" fill="#fde8e8" opacity="0.35" filter="url(#rough-light)"/>

  <!-- sweet spot glow area -->
  <ellipse cx="420" cy="150" rx="130" ry="65" fill="url(#sweetGlow)"/>

  <!-- main spectrum bar -->
  <rect x="80" y="138" width="680" height="24" rx="12" fill="#e5e5e5" filter="url(#rough)"/>

  <!-- gradient fill for the bar -->
  <defs>
    <linearGradient id="spectrumGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="20%" stop-color="#f0c27f"/>
      <stop offset="40%" stop-color="#a8e6a0"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#a8e6a0"/>
      <stop offset="80%" stop-color="#f0c27f"/>
      <stop offset="100%" stop-color="#ef9a9a"/>
    </linearGradient>
  </defs>
  <rect x="80" y="138" width="680" height="24" rx="12" fill="url(#spectrumGrad)" opacity="0.7" filter="url(#rough)"/>

  <!-- tick marks along the bar (hand-drawn style) -->
  <line x1="180" y1="134" x2="180" y2="168" stroke="#ccc" stroke-width="1.5" filter="url(#rough-light)"/>
  <line x1="310" y1="134" x2="310" y2="168" stroke="#ccc" stroke-width="1.5" filter="url(#rough-light)"/>
  <line x1="530" y1="134" x2="530" y2="168" stroke="#ccc" stroke-width="1.5" filter="url(#rough-light)"/>
  <line x1="660" y1="134" x2="660" y2="168" stroke="#ccc" stroke-width="1.5" filter="url(#rough-light)"/>

  <!-- sweet spot marker -->
  <circle cx="420" cy="150" r="18" fill="#ffffff" stroke="#1a6847" stroke-width="2.5" filter="url(#rough)"/>
  <circle cx="420" cy="150" r="7" fill="#1a6847" filter="url(#rough-light)"/>

  <!-- hand-drawn bracket around sweet spot region -->
  <path d="M 340 178 C 340 192, 345 196, 365 196 L 400 196" stroke="#1a6847" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#rough-light)"/>
  <path d="M 500 178 C 500 192, 495 196, 475 196 L 440 196" stroke="#1a6847" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#rough-light)"/>
  <!-- small downward tick in center of bracket -->
  <line x1="420" y1="196" x2="420" y2="208" stroke="#1a6847" stroke-width="1.8" stroke-linecap="round" filter="url(#rough-light)"/>

  <!-- endpoint labels -->
  <text x="80" y="118" class="label label-endpoint" text-anchor="start">Never uses AI</text>
  <text x="80" y="200" class="label label-sub" text-anchor="start">"I don't need it"</text>

  <text x="760" y="118" class="label label-endpoint" text-anchor="end">Fully dependent on AI</text>
  <text x="760" y="200" class="label label-sub" text-anchor="end">"I can't work without it"</text>

  <!-- sweet spot label -->
  <text x="420" y="226" class="label label-sweet" text-anchor="middle">The sweet spot</text>
  <text x="420" y="248" class="label label-sub" text-anchor="middle" style="fill: #4b7c65;">AI accelerates you but you can still do the work yourself</text>

  <!-- zone labels (top) -->
  <text x="130" y="100" class="label label-zone" text-anchor="middle">Leaving value on the table</text>
  <text x="710" y="100" class="label label-zone" text-anchor="middle">Skills eroding without you noticing</text>

  <!-- small hand-drawn arrows pointing to sweet spot -->
  <path d="M 345 72 C 360 60, 390 58, 413 117" stroke="#1a6847" stroke-width="1.3" fill="none" stroke-linecap="round" filter="url(#rough-light)"/>
  <path d="M 395 110 L 415 120 L 414 92" stroke="#1a6847" stroke-width="3.3" fill="none" stroke-linecap="round"/>
  <text x="328" y="72" class="label label-arrow" text-anchor="end">aim here</text>

  <!-- bottom annotation -->
  <text x="420" y="295" class="annotation" text-anchor="middle">Most people don't realize they're drifting right until they try working without it.</text>

  <!-- small sketchy underline under the annotation -->
  <path d="M 200 300 C 280 303, 400 298, 640 302" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough-light)"/>
</svg>
